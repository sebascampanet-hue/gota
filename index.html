<style>*,*::before,*::after{box-sizing:border-box}html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Gota · Cicles Artà</title>
<title>Gota · Cicles Artà</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app; home = zigzag path of lesson stones on a running-track lane, lesson = full-screen card + bottom check bar */
:root{
  --bg:#F4FAFA; --surface:#FFFFFF; --ink:#10292B; --muted:#5B7275; --line:#D5E6E7;
  --accent:#14C8C8; --accent-deep:#0A9A9C; --accent-soft:#D6F5F5;
  --ok:#2FB35A; --ok-soft:#E1F6E7; --ok-deep:#1E8A42;
  --bad:#E5484D; --bad-soft:#FDE6E7; --bad-deep:#B4262B;
  --gold:#F5B014; --locked:#C9D6D7; --locked-deep:#A7B8B9;
  --chal:#7C5CE6; --chal-deep:#5A3DC0; --chal-soft:#E8E1FC;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1A1B; --surface:#132628; --ink:#E6F4F4; --muted:#93AEB0; --line:#25403F;
  --accent:#22D3D3; --accent-deep:#0E8F91; --accent-soft:#123A3B;
  --ok:#3CC66A; --ok-soft:#12301D; --ok-deep:#2C9A50;
  --bad:#F0626A; --bad-soft:#3A1719; --bad-deep:#B83A40;
  --gold:#F7BD3A; --locked:#2E4547; --locked-deep:#21393A; --chal:#9A80F2; --chal-deep:#6A4FD0; --chal-soft:#2A2350; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1A1B; --surface:#132628; --ink:#E6F4F4; --muted:#93AEB0; --line:#25403F;
  --accent:#22D3D3; --accent-deep:#0E8F91; --accent-soft:#123A3B;
  --ok:#3CC66A; --ok-soft:#12301D; --ok-deep:#2C9A50;
  --bad:#F0626A; --bad-soft:#3A1719; --bad-deep:#B83A40;
  --gold:#F7BD3A; --locked:#2E4547; --locked-deep:#21393A; --chal:#9A80F2; --chal-deep:#6A4FD0; --chal-soft:#2A2350; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:2px solid var(--line);padding-block:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;color:var(--accent-deep)}
.stats{display:flex;gap:14px}
.stat{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}
.st-streak{color:var(--gold)} .st-xp{color:var(--accent-deep)} .st-lives{color:var(--bad)}

.sound{background:none;border:0;padding:2px;color:var(--muted);display:grid;place-items:center}
.sound svg{width:24px;height:24px}
.sound.on{color:var(--accent-deep)}
/* home */
.hero{display:flex;align-items:flex-end;gap:12px;padding-block:18px 6px}
.hero img{width:96px;flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:600;margin-bottom:28px;min-width:0}
.bubble::after{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.unit-head{margin-top:14px;border-radius:16px;background:var(--accent);color:#06292A;padding:14px 16px}
.unit-head .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;opacity:.8}
.unit-head h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:2px 0 0;text-wrap:balance}
.section{margin-top:26px}
.sec-label{display:flex;align-items:center;gap:10px;color:var(--muted);font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.sec-label::before,.sec-label::after{content:"";flex:1;height:2px;background:var(--line)}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:18px 6px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.stone{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--accent);box-shadow:0 7px 0 var(--accent-deep);transition:transform .08s}
.stone svg{width:34px;height:34px;color:#fff}
.node:active .stone{transform:translateY(5px);box-shadow:0 2px 0 var(--accent-deep)}
.node.done .stone{background:var(--gold);box-shadow:0 7px 0 #C68A06}
.node.locked .stone{background:var(--locked);box-shadow:0 7px 0 var(--locked-deep)}
.node.locked{cursor:not-allowed}
.node.current .stone{outline:5px solid var(--accent-soft);outline-offset:4px}
.node .lbl{font-weight:700;font-size:15px;max-width:180px;text-align:center;text-wrap:balance}
.node.locked .lbl{color:var(--muted)}
.foot{color:var(--muted);font-size:14px;text-align:center;padding-block:30px 40px;display:flex;flex-direction:column;gap:10px;align-items:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* lesson */
.lesson{display:flex;flex-direction:column;min-height:100%;flex:1}
.lhead{display:flex;align-items:center;gap:12px;padding-block:14px}
.x{background:none;border:0;padding:4px;color:var(--muted)}
.x svg{width:26px;height:26px;display:block}
.bar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s ease}
.lbody{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
.kind{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--accent-deep)}
.q{display:flex;gap:10px;align-items:flex-end}
.q img{width:84px;flex:none}
.q .bubble{margin-bottom:22px;font-size:19px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;font-weight:600;font-size:17px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .opt{text-align:center;font-family:var(--display);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding-block:18px}
.sentence{font-size:20px;font-weight:600;line-height:1.7}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent-deep);padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips .opt{padding:10px 14px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.pairs .opt{font-size:15px;padding:11px 10px;min-height:56px;text-align:center}
.pairs .opt.gone{opacity:.35;border-color:var(--line);background:transparent}
.pairs .opt.miss{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.check{position:sticky;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px))}
.check.ok{background:var(--ok-soft);border-color:transparent}
.check.bad{background:var(--bad-soft);border-color:transparent}
.fb{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.fb img{width:62px;flex:none}
.fb h3{margin:0;font-family:var(--display);font-weight:800;font-size:24px}
.check.ok .fb h3{color:var(--ok-deep)} .check.bad .fb h3{color:var(--bad-deep)}
.fb p{margin:2px 0 0;font-size:15px}
.big{width:100%;border:0;border-radius:14px;padding:14px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:#06292A;box-shadow:0 4px 0 var(--accent-deep)}
.big:disabled{background:var(--locked);box-shadow:0 4px 0 var(--locked-deep);color:var(--muted);cursor:default}
.check.ok .big{background:var(--ok);box-shadow:0 4px 0 var(--ok-deep);color:#fff}
.check.bad .big{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep);color:#fff}
.big.ghost{background:transparent;box-shadow:none;border:2px solid var(--line);color:var(--muted)}

/* end */
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-block:30px}
.end img{width:190px}
.end h2{font-family:var(--display);font-weight:800;font-size:34px;margin:0;text-wrap:balance}
.tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tile{border:2px solid var(--line);border-radius:14px;min-width:120px;overflow:hidden;background:var(--surface)}
.tile b{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;padding:5px;color:#fff}
.tile span{display:block;font-family:var(--display);font-weight:800;font-size:28px;padding:8px;font-variant-numeric:tabular-nums}
.t-xp b{background:var(--gold)} .t-acc b{background:var(--ok)}
.end .actions{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:10px}
/* repàs, repte i tipus nous */
.review{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px}
.review .ric{width:44px;height:44px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;flex:none}
.review .ric svg{width:24px;height:24px}
.review b{display:block;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.review small{color:var(--muted);font-size:14px}
.node.repte .stone{border-radius:22px;background:var(--chal);box-shadow:0 7px 0 var(--chal-deep)}
.node.repte.open .stone{animation:pulse 1.5s ease-in-out infinite;outline:5px solid var(--chal-soft);outline-offset:4px}
.node.repte.done .stone{background:var(--gold);box-shadow:0 7px 0 #C68A06}
.node.repte.locked .stone{background:var(--locked);box-shadow:0 7px 0 var(--locked-deep)}
.node .lbl small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.st-clock{color:var(--chal)} .st-clock.hurry{color:var(--bad);animation:pick .5s infinite}
.st-redo{color:var(--bad)}
.bar.repte i{background-color:var(--chal)}
.fig{display:block;width:100%;max-width:100%;border-radius:14px;border:2px solid var(--line);background:#fff}
.slots{display:flex;flex-direction:column;gap:8px;min-height:64px;padding:10px;border:2px dashed var(--line);border-radius:14px}
.slots .ph{color:var(--muted);font-size:15px;margin:auto}
.bank{display:flex;flex-direction:column;gap:8px}
.opt.placed{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:10px 12px}
.opt .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#06292A;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px}
.bank .opt{font-size:15px;padding:10px 12px}
.inp{width:100%;font:inherit;font-size:20px;font-weight:600;padding:14px;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}
.inp.right{border-color:var(--ok);background:var(--ok-soft)} .inp.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
/* medalles i objectiu diari */
.goal{display:flex;gap:14px;align-items:center;margin-top:14px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.ring{--p:0;width:58px;height:58px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.goal.fet .ring span{background:var(--gold);color:#3A2600}
.goal b{display:block;font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.goal small{display:block;color:var(--muted);font-size:14px}
.goalpick{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--muted)}
.goalpick button{width:30px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:14px}
.goalpick button.on{border-color:var(--gold);background:var(--gold);color:#3A2600}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.medal{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.medal svg{width:52px;height:60px}
.medal:not(.got) svg{filter:grayscale(1);opacity:.35}
.medal.got{color:var(--ink)}
.medal.got svg{animation:popin .5s cubic-bezier(.2,1.6,.4,1) backwards}
.bigmedal svg{width:170px;height:196px;animation:medalin 1s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes medalin{0%{transform:scale(.2) rotate(-200deg);opacity:0}100%{transform:none;opacity:1}}
.goalbanner{display:flex;gap:10px;align-items:center;background:var(--gold);color:#3A2600;border-radius:14px;padding:10px 14px;font-weight:700;animation:popin .5s cubic-bezier(.2,1.6,.4,1) backwards .6s}
.goalbanner svg{width:24px;height:24px;flex:none}
/* rànquing */
.rankbtn{background:none;border:0;padding:2px;color:var(--gold);display:grid;place-items:center}
.rankbtn svg{width:24px;height:24px}
.rank{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:18px 30px}
.rank h2{font-family:var(--display);font-weight:800;font-size:30px;margin:0}
.rank .sub{color:var(--muted);margin:0}
.rlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;animation:popin .35s backwards}
.rrow.me{border-color:var(--accent);background:var(--accent-soft)}
.rpos{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--line);flex:none}
.rrow:nth-child(1) .rpos{background:#F5B014;color:#3A2600}.rrow:nth-child(2) .rpos{background:#C9D3D6;color:#23393B}.rrow:nth-child(3) .rpos{background:#D98E4A;color:#3A1E00}
.rname{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rxp{font-family:var(--display);font-weight:800;font-size:20px;color:var(--accent-deep);font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field small{font-weight:500;color:var(--muted)}
.msg{color:var(--bad-deep);font-weight:600;margin:0}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:10px 0 0;color:var(--muted);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.back svg{width:18px;height:18px}
.card{display:block;width:100%;text-align:left;margin-top:12px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 16px;transition:transform .1s}
.card:active{transform:scale(.98)}
.card .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.card h2{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1;margin:2px 0 10px;text-wrap:balance}
.card.modul{background:var(--accent);border-color:var(--accent-deep);color:#06292A}
.card.modul .eyebrow{color:#06292A;opacity:.75}
.pline{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.pline .pb{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.card.modul .pline .pb{background:rgba(255,255,255,.45)}
.pline .pb i{display:block;height:100%;background:var(--ok);border-radius:99px}
.google{display:flex;align-items:center;justify-content:center;gap:10px}
.google svg{width:24px;height:24px;background:#fff;border-radius:50%;padding:3px}
/* animacions */
.hero img,.q img{transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-7px) rotate(-3deg)}60%{transform:translateY(-3px) rotate(2deg)}}
.bubble{animation:bubblein .45s cubic-bezier(.2,1.6,.4,1) backwards .15s;transform-origin:0 100%}
@keyframes bubblein{from{opacity:0;transform:scale(.6)}}
.path .node{animation:popin .45s cubic-bezier(.2,1.5,.4,1) backwards}
.path .node:nth-child(2){animation-delay:.07s}.path .node:nth-child(3){animation-delay:.14s}.path .node:nth-child(4){animation-delay:.21s}
@keyframes popin{from{opacity:0;scale:.5}}
.node.current .stone{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{outline-offset:4px;scale:1}50%{outline-offset:10px;scale:1.06}}
.node.current .stone svg{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(25deg) scale(1.2)}94%{transform:rotate(-15deg)}}
.lbody{animation:slidein .35s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}}
.opts .opt,.chips .opt,.vf .opt,.pairs .opt{animation:popin .35s cubic-bezier(.2,1.5,.4,1) backwards}
.opts .opt:nth-child(2),.chips .opt:nth-child(2),.vf .opt:nth-child(2),.pairs .opt:nth-child(2){animation-delay:.06s}
.opts .opt:nth-child(3),.chips .opt:nth-child(3),.pairs .opt:nth-child(3){animation-delay:.12s}
.opts .opt:nth-child(4),.chips .opt:nth-child(4),.pairs .opt:nth-child(4){animation-delay:.18s}
.opt{transition:transform .1s,background-color .15s,border-color .15s}
.opt:active{transform:scale(.96)}
.opt.sel{animation:pick .25s ease-out}
@keyframes pick{50%{transform:scale(1.04)}}
.opt.right{animation:pick .35s ease-out}
.opt.wrong{animation:shake .4s}
.check.ok .fb,.check.bad .fb{animation:up .3s ease-out}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.check.ok .fb img{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:translateY(20px) scale(.8)}50%{transform:translateY(-14px) rotate(-6deg)}100%{transform:none}}
.check.bad .fb img{animation:shake .5s}
.st-lives.lost svg{animation:heartbreak .6s ease-out}
@keyframes heartbreak{30%{transform:scale(1.5)}60%{transform:scale(.7) rotate(-15deg)}}
.bar i{background-image:linear-gradient(to bottom,rgba(255,255,255,.35) 0 35%,transparent 35%)}
.end img{animation:hop 1.1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-4deg)}60%{transform:translateY(-22px) rotate(4deg)}}
.end h2{animation:popin .5s cubic-bezier(.2,1.6,.4,1) backwards .1s}
.tile{animation:popin .45s cubic-bezier(.2,1.6,.4,1) backwards .3s}.tile+.tile{animation-delay:.45s}
.end img.anim{animation:none;width:230px}
.confeti{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>

<script>
const IMG={contenta:'mascota-contenta.png',celebrant:'mascota-celebrant.png',trista:'mascota-trista.png',pensativa:'mascota-pensativa.png',anim:'gota-celebra.webp'};
try{new Image().src='gota-celebra.webp'}catch(e){}
// Per afegir mòduls o temes: afegeix el fitxer JSON a fonts.json (i aquí, per a la versió sense web).
const FONTS_CONTINGUT=['contingut.json'];
const MAX_VIDES=5, MIN_PER_VIDA=20, XP_LLICO=10;
const ICON={
  fire:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.5 5 5.6 5 10.5A5 5 0 0 1 12 22a5 5 0 0 1-5-5.2c0-2.6 1.6-4 2.4-5.6.4 1.6 1.2 2.4 2.2 2.6C10.8 10.7 11 6 12 2z"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5.2-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 15.8 12 21 12 21z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.5 2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm2 0h6V7a3 3 0 0 0-6 0z"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const avui=()=>new Date().toLocaleDateString('sv');

/* ---------- música i sons (generats al moment, sense fitxers) ---------- */
const SO={ctx:null,on:true,music:null,master:null};
try{SO.on=localStorage.getItem('gota-so')!=='0'}catch(e){}
function audio(){
  if(!SO.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    SO.ctx=new C();SO.master=SO.ctx.createGain();SO.master.gain.value=.5;SO.master.connect(SO.ctx.destination);}
  if(SO.ctx.state==='suspended')SO.ctx.resume();
  return SO.ctx;
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function nota(f,t,d,tipus,vol){
  const c=SO.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=tipus;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(SO.master);o.start(t);o.stop(t+d+.05);
}
const PROG=[[48,60,64,67],[45,57,60,64],[41,53,57,60],[43,55,59,62]];
const MEL=[[76,0,79,0,81,79,76,0],[72,0,76,0,79,0,76,74],[72,0,77,0,81,0,79,77],[74,0,79,0,83,81,79,0]];
function musicaOn(){
  if(!SO.on||SO.music||!audio())return;
  const pas=60/112/2;let n=0,t=SO.ctx.currentTime+.1;
  SO.music=setInterval(()=>{
    if(t<SO.ctx.currentTime)t=SO.ctx.currentTime+.05;
    while(t<SO.ctx.currentTime+.3){
      const c=Math.floor(n/8)%4,s=n%8,ch=PROG[c];
      if(s%4===0)nota(hz(ch[0]),t,pas*3,'triangle',.12);
      nota(hz(ch[1+(s%3)]),t,pas*.8,'square',.022);
      const m=MEL[c][s];if(m)nota(hz(m),t,pas*1.6,'triangle',.07);
      n++;t+=pas;
    }
  },100);
}
function musicaOff(){clearInterval(SO.music);SO.music=null}

/* ---------- confeti i comptador ---------- */
function confeti(){
  document.querySelectorAll('.count').forEach(el=>{const n=+el.dataset.n;let i=0;const t=setInterval(()=>{i++;el.textContent='+'+i;if(i>=n)clearInterval(t)},45);el.textContent='+0'});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.className='confeti';document.body.appendChild(cv);
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cols=['#14C8C8','#F5B014','#2FB35A','#E5484D','#4C7CF0','#B25CE6'];
  const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*60,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(now){
    g.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()});
    if(now-t0<3200)requestAnimationFrame(f);else cv.remove();
  })(t0);
}
function fx(k){
  if(!SO.on||!audio())return;const t=SO.ctx.currentTime;
  if(k==='ok'){nota(hz(79),t,.12,'square',.08);nota(hz(84),t+.1,.28,'square',.08)}
  else if(k==='bad'){nota(hz(52),t,.18,'sawtooth',.06);nota(hz(48),t+.16,.32,'sawtooth',.06)}
  else if(k==='fi'){[72,76,79,84,88].forEach((m,i)=>nota(hz(m),t+i*.1,.4,'square',.07))}
}
const ICON_SO={on:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  off:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m16 9 6 6m0-6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'};
const botoSo=()=>`<button class="sound ${SO.on?'on':''}" id="so" aria-label="${SO.on?'Silenciar la música':'Activar la música'}" title="Música">${SO.on?ICON_SO.on:ICON_SO.off}</button>`;
document.addEventListener('click',ev=>{
  const b=ev.target.closest('#so');
  if(b){SO.on=!SO.on;try{localStorage.setItem('gota-so',SO.on?'1':'0')}catch(e){}
    if(SO.on)musicaOn();else musicaOff();
    b.outerHTML=botoSo();return;}
  musicaOn();
});
document.addEventListener('visibilitychange',()=>{if(SO.ctx){document.hidden?SO.ctx.suspend():SO.ctx.resume()}});

/* ---------- progrés (només en aquest mòbil) ---------- */
const KEY='gota-progres-v1';
const nouP=()=>({compte:null,modul:null,tema:null,fallades:{},ts:0,fetes:{},xp:0,ratxa:0,darrerDia:null,vides:MAX_VIDES,vidaTs:Date.now(),errors:{},reptes:{},medalles:{},objectiu:2,avui:{d:null,n:0},setmana:null,xpSetmana:0,jugador:null});
let P=nouP();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)P={...nouP(),...s}}catch(e){}
const desa=()=>{P.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}pujaNuvol()};

/* ---------- compte de Google de l'institut i núvol (Supabase) ---------- */
const WEB=!!(window.supabase&&window.supabase.createClient);
let SB=null, JO=null, nuvolT=null;
function pujaNuvol(){if(!JO||JO.profe)return;clearTimeout(nuvolT);nuvolT=setTimeout(enviaNuvol,1500)}
async function enviaNuvol(){
  if(!JO||JO.profe)return;clearTimeout(nuvolT);xpSetmanaActual();
  try{await SB.rpc('gota_desa_meu',{p_dades:{...P,jugador:null},p_setmana:P.setmana,p_xp_setmana:P.xpSetmana,p_xp_total:P.xp,p_llicons:Object.keys(P.fetes).length})}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&nuvolT)enviaNuvol()});
function fusiona(srv){
  const loc=P, email=JO.email;
  if(srv&&Object.keys(srv).length){
    if(loc.compte===email&&(loc.ts||0)>(srv.ts||0))P=loc;
    else if(!loc.compte&&Object.keys(loc.fetes).length){
      P={...nouP(),...srv};
      P.fetes={...loc.fetes,...srv.fetes};P.medalles={...loc.medalles,...srv.medalles};P.errors={...loc.errors,...srv.errors};
      for(const k in loc.reptes)P.reptes[k]=Math.max(loc.reptes[k],srv.reptes&&srv.reptes[k]!=null?srv.reptes[k]:-1);
      for(const k in loc.fallades)P.fallades[k]=Math.max(loc.fallades[k],P.fallades[k]||0);
      P.xp=Math.max(loc.xp,srv.xp||0);
      if(loc.setmana===P.setmana)P.xpSetmana=Math.max(loc.xpSetmana,P.xpSetmana||0);
    }else P={...nouP(),...srv};
  }else if(loc.compte&&loc.compte!==email)P=nouP();
  P.compte=email;P.jugador=null;desa();enviaNuvol();
}
const G_ICON='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.2C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.2C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';
function pantallaEntra(msg){
  window.scrollTo(0,0);
  $('#app').innerHTML=`<div class="end gut"><img src="${IMG.contenta}" alt="La Gota, mascota dels Cicles">
    <h2>Hola! Sóc la Gota</h2>
    <p style="margin:0;color:var(--muted);max-width:34ch">Entra amb el teu compte de Google de l'institut per desar el progrés i sortir al rànquing de la teva classe.</p>
    ${msg?`<p class="msg" style="max-width:34ch">${esc(msg)}</p>`:''}
    <div class="actions"><button class="big google" id="google">${G_ICON}<span>Entra amb Google</span></button></div></div>`;
  $('#google').onclick=async()=>{$('#google').disabled=true;
    const {error}=await SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});
    if(error){$('#google').disabled=false;pantallaEntra('No s\'ha pogut connectar. Revisa la connexió i torna-ho a provar.')}};
}
function pantallaNoAlumne(email){
  $('#app').innerHTML=`<div class="end gut"><img src="${IMG.pensativa}" alt="La Gota pensativa">
    <h2>Aquest compte no és d'alumne</h2>
    <p style="margin:0;color:var(--muted);max-width:34ch">Has entrat com a ${esc(email)}, però no surts a cap llista de classe. Si ets alumne, entra amb el correu de l'institut. Si no, pots provar l'app sense desar res al núvol.</p>
    <div class="actions"><button class="big" id="altre">Entra amb un altre compte</button><button class="big ghost" id="prova">Prova sense compte</button></div></div>`;
  $('#altre').onclick=async()=>{await SB.auth.signOut();pantallaEntra()};
  $('#prova').onclick=()=>{JO=null;inici()};
}
async function tancaSessio(){
  await enviaNuvol();await SB.auth.signOut();const eraProfe=JO&&JO.profe;JO=null;if(!eraProfe){P=nouP();try{localStorage.removeItem(KEY)}catch(e){}}pantallaEntra();
}
function recuperaVides(){
  if(P.vides>=MAX_VIDES){P.vidaTs=Date.now();return}
  const n=Math.floor((Date.now()-P.vidaTs)/(MIN_PER_VIDA*60000));
  if(n>0){P.vides=Math.min(MAX_VIDES,P.vides+n);P.vidaTs+=n*MIN_PER_VIDA*60000;desa()}
}
function ratxaActual(){
  if(!P.darrerDia)return 0;
  const d=(new Date(avui())-new Date(P.darrerDia))/864e5;
  return d<=1?P.ratxa:0;
}
function sumaDia(){
  const a=avui();if(P.darrerDia===a)return;
  P.ratxa=ratxaActual()+1;P.darrerDia=a;
}

/* ---------- contingut ---------- */
let UNITATS=[];const EX={};
async function carrega(){
  let fonts=FONTS_CONTINGUT;try{const f=await fetch('fonts.json',{cache:'no-cache'});if(f.ok)fonts=await f.json()}catch(e){}
  const r=await Promise.all(fonts.map(f=>fetch(f).then(x=>x.json())));
  UNITATS=r.map(d=>({modul:d.modul,...d.unitat}));
  UNITATS.forEach(u=>u.seccions.forEach(s=>s.llicons.forEach(l=>l.exercicis.forEach((e,i)=>{EX[l.id+'#'+i]={e,sid:s.id}}))));
}
const totesLlicons=u=>u.seccions.flatMap(s=>s.llicons);

/* ---------- pantalla inicial ---------- */
const ICON2={
  trophy:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3zm0 4H6v1a2 2 0 0 0 1 1.7zm10 0v2.7A2 2 0 0 0 18 8V7z"/></svg>',
  redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>'
};
const REPTE_N=8, REPTE_S=90;
function topbar(){
  recuperaVides();
  return `<header class="top gut"><div class="top-row">
    <span class="brand">Gota</span>
    <div class="stats">
      <span class="stat st-streak" title="Dies seguits">${ICON.fire}${ratxaActual()}</span>
      <span class="stat st-xp" title="Punts">${ICON.bolt}${P.xp}</span>
      <span class="stat st-lives" title="Vides">${ICON.heart}${P.vides}</span>
      <button class="rankbtn" id="rank" aria-label="Rànquing de la classe" title="Rànquing">${ICON2.trophy}</button>${botoSo()}
    </div></div></header>`;
}
const nErrors=()=>Object.keys(P.errors).filter(k=>EX[k]).length;
function inici(){
  clearInterval(L&&L.timer);L=null;
  for(const u of UNITATS)for(const [si,s] of u.seccions.entries()){
    if(!P.medalles[s.id]&&s.llicons.every(l=>P.fetes[l.id])){P.medalles[s.id]=avui();desa();return pantallaMedalla(s,si+1)}
  }
  const mods=moduls();
  if(!mods.find(m=>m.id===P.modul))P.modul=null;
  if(!P.modul)return pantallaModuls();
  const m=mods.find(x=>x.id===P.modul);
  const u=m.temes.find(t=>t.id===P.tema);
  if(!u)return pantallaTemes(m);
  P.tema=u.id;
  pantallaTema(u,m);
}
const ICON_BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>';
function moduls(){
  const ms=[];UNITATS.forEach(u=>{let m=ms.find(x=>x.id===u.modul.id);if(!m){m={...u.modul,temes:[]};ms.push(m)}m.temes.push(u)});return ms;
}
function progres(ll){const f=ll.filter(l=>P.fetes[l.id]).length;return{f,t:ll.length,pc:ll.length?Math.round(f/ll.length*100):0}}
const pline=(p,txt)=>`<div class="pline"><span class="pb"><i style="width:${p.pc}%"></i></span><span>${txt||`${p.f}/${p.t}`}</span></div>`;
const salutacio=()=>JO?(JO.profe?'Hola, profe! ':`Hola, ${esc(JO.nom)}! `):'Hola! ';
function peu(){
  if(JO&&JO.profe)return `<div class="foot"><span>Mode professor. El teu progrés es guarda només en aquest dispositiu i no surt al rànquing.</span>
    <a class="linkbtn" href="https://dashboard-docent.vercel.app/gota" target="_blank" rel="noreferrer">Veure el progrés dels alumnes</a>
    <button class="linkbtn" id="logout">Tancar la sessió</button></div>`;
  return JO?`<div class="foot"><span>Has entrat com a ${esc(JO.nom)}${JO.classe?` (${esc(JO.classe)})`:''}. El progrés es desa al teu compte.</span>
    <button class="linkbtn" id="logout">Tancar la sessió</button></div>`:
    `<div class="foot"><span>El progrés es guarda només en aquest dispositiu.</span>
    <button class="linkbtn" id="reset">Esborrar el meu progrés</button></div>`;
}
function lligaPeu(){
  $('#rank').onclick=pantallaRanking;
  const lo=$('#logout');if(lo)lo.onclick=tancaSessio;
  const r=$('#reset');if(!r)return;let arm=false;
  r.onclick=()=>{ if(!arm){arm=true;r.textContent='Toca un altre cop per confirmar';setTimeout(()=>{arm=false;r.textContent='Esborrar el meu progrés'},3000);return}
    P=nouP();desa();inici()};
}
function pantallaModuls(){
  window.scrollTo(0,0);
  let html=topbar()+`<main class="gut"><div class="hero"><img src="${IMG.contenta}" alt="La Gota, mascota dels Cicles"><div class="bubble">${salutacio()}Quin mòdul vols practicar?</div></div>`;
  moduls().forEach(m=>{const p=progres(m.temes.flatMap(totesLlicons));
    html+=`<button class="card modul" data-m="${esc(m.id)}"><div class="eyebrow">Mòdul · ${m.temes.length} ${m.temes.length===1?'tema':'temes'}</div><h2>${esc(m.titol)}</h2>${pline(p,`${p.f}/${p.t} lliçons`)}</button>`});
  $('#app').innerHTML=html+'</main>'+peu();
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{P.modul=b.dataset.m;P.tema=null;desa();inici()});
  lligaPeu();
}
function pantallaTemes(m){
  window.scrollTo(0,0);
  let html=topbar()+`<main class="gut"><button class="back" id="amods">${ICON_BACK}Mòduls</button>
    <div class="unit-head"><div class="eyebrow">Mòdul</div><h1>${esc(m.titol)}</h1></div>`;
  m.temes.forEach(u=>{const p=progres(totesLlicons(u));
    html+=`<button class="card" data-t="${esc(u.id)}"><div class="eyebrow">${p.f===p.t?'Tema acabat':p.f?'En marxa':'Per començar'}</div><h2>${esc(u.titol)}</h2>${pline(p,`${p.f}/${p.t} lliçons`)}</button>`});
  $('#app').innerHTML=html+'</main>'+peu();
  $('#amods').onclick=()=>{P.modul=null;P.tema=null;desa();inici()};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{P.tema=b.dataset.t;desa();inici()});
  lligaPeu();
}
function pantallaTema(u,m){
  let html=topbar()+`<main class="gut"><button class="back" id="atemes">${ICON_BACK}Temes de ${esc(m.titol)}</button>`;
  {
    const ll=totesLlicons(u);
    const pend=ll.find(l=>!P.fetes[l.id]);
    const fetes=ll.filter(l=>P.fetes[l.id]).length;
    const msg=!pend?'Has acabat tota la unitat! Ets una màquina!':
      fetes===0?`${salutacio()}Començam amb «${esc(pend.titol)}»?`:`Vas per ${fetes} de ${ll.length}. Seguim amb «${esc(pend.titol)}»!`;
    html+=`<div class="hero"><img src="${IMG[pend?'contenta':'celebrant']}" alt="La Gota, mascota dels Cicles"><div class="bubble">${msg}</div></div>`;
    const ne=nErrors();

function muntaOrdre(){

  };

}
function muntaParelles(){
  const e=L.e;
  document.querySelectorAll('.pairs .opt').forEach(b=>b.onclick=()=>{
    if(L.estat!=='resp'||b.disabled)return;
    if(b.dataset.s==='e'){
      document.querySelectorAll('.pairs .opt[data-s="e"]').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');L.par.esq=b;return;
    }
    if(!L.par.esq)return;

    }else{
      L.par.errors++;
      [L.par.esq,b].forEach(x=>{x.classList.add('miss');setTimeout(()=>x.classList.remove('miss'),400)});

function correcta(e){
  if(e.tipus==='vf')return e.correcta?'Vertader':'Fals';
  if(e.tipus==='ordre')return e.passos.map((p,i)=>`${i+1}) ${p}`).join('  ');
  if(e.tipus==='escriu')return e.respostes[0];
  return e.opcions[e.correcta];
}
function comprova(){
  const e=L.e;let ok;
  if(e.tipus==='escriu'){
    const inp=$('#resp');ok=e.respostes.map(norm).includes(norm(inp.value));
    inp.disabled=true;inp.classList.add(ok?'right':'wrong');
  }else if(e.tipus==='ordre'){
    ok=L.seq.every((v,i)=>v===i);
    document.querySelectorAll('#slots .opt').forEach((b,n)=>{b.disabled=true;b.classList.add(+b.dataset.p===n?'right':'wrong')});
  }else{
    ok=e.tipus==='vf'?(L.resposta===1)===e.correcta:L.resposta===e.correcta;
    document.querySelectorAll('.opt').forEach(b=>{
      b.disabled=true;
      const v=+b.dataset.v;
      const esCorr=e.tipus==='vf'?(v===1)===e.correcta:v===e.correcta;
      if(esCorr)b.classList.add('right');else if(b.classList.contains('sel'))b.classList.add('wrong');
    });
  }
  resol(ok,ok?null:(e.tipus==='ordre'?'Ordre correcte: ':'Resposta correcta: ')+correcta(e));
}
function resol(ok,detall){
  const e=L.e;L.estat='fet';
  const idx=L.cua.shift(), key=L.items[idx].key;
  if(ok){L.encerts++; if(!L.intents[idx])L.primers++;}
  else L.intents[idx]=1;
  if(L.mode==='llico'){
    if(!ok){P.fallades[key]=(P.fallades[key]||0)+1;L.cua.push(idx);P.errors[key]=1;P.vides=Math.max(0,P.vides-1);if(P.vides===MAX_VIDES-1)P.vidaTs=Date.now();}
    else if(L.intents[idx])P.errors[key]=1;
  }else if(L.mode==='repas'){
    if(ok&&!L.intents[idx])delete P.errors[key];
    if(!ok){L.cua.push(idx);P.fallades[key]=(P.fallades[key]||0)+1}
  }else if(L.mode==='repte'){
    if(!ok){P.errors[key]=1;P.fallades[key]=(P.fallades[key]||0)+1}
  }
  desa();
  const frasesOk=['Molt bé!','Perfecte!','Així es fa!','Genial!','Exacte!'];
  const fb=$('#fb');fb.hidden=false;
  const exp=e.explicacio?`<p>${esc(e.explicacio)}</p>`:'';
  fb.innerHTML=`<img src="${IMG[ok?'celebrant':'trista']}" alt=""><div><h3>${ok?frasesOk[Math.floor(Math.random()*frasesOk.length)]:'Ui, no és aquesta'}</h3>${detall?`<p><b>${esc(detall)}</b></p>`:''}${exp}</div>`;
  const c=$('#check');c.classList.add(ok?'ok':'bad');fx(ok?'ok':'bad');
  const g=$('#go');g.hidden=false;g.disabled=false;g.textContent='Continua';g.focus();
  const tot=L.mode==='repte'?L.total-L.cua.length:L.encerts;
  $('.bar i').style.width=Math.round(tot/L.total*100)+'%';
  const lv=document.querySelector('.lhead .st-lives');
  if(lv){lv.innerHTML=ICON.heart+P.vides;if(!ok)lv.classList.add('lost')}
  const rd=document.querySelector('.lhead .st-redo');if(rd)rd.innerHTML=ICON2.redo+L.cua.length;
}

}
function final(){
  const acc=Math.round(L.primers/L.total*100);
  if(L.mode==='repas'){
    const xp=5;afegeixXP(xp);sumaDia();const meta=sumaActivitat();desa();fx('fi');setTimeout(confeti,60);
    const queden=nErrors();
    pantallaFinal('celebrant','Repàs fet!',queden?`Encara et queden ${queden} preguntes per repassar.`:'Has corregit tots els errors. Molt bé!',
      `<div class="tile t-xp"><b>Punts</b><span class="count" data-n="${xp}">+${xp}</span></div><div class="tile t-acc"><b>A la primera</b><span>${acc}%</span></div>`,bannerObjectiu(meta));
  }else{
    const xp=XP_LLICO+(acc===100?5:0);
    P.fetes[L.llico.id]=true;afegeixXP(xp);sumaDia();const meta=sumaActivitat();
    let next=inici;
    UNITATS.forEach(u=>u.seccions.forEach((s,si)=>{
      if(s.llicons.some(l=>l.id===L.llico.id)&&!P.medalles[s.id]&&s.llicons.every(l=>P.fetes[l.id])){P.medalles[s.id]=avui();next=()=>pantallaMedalla(s,si+1)}
    }));
    desa();fx('fi');setTimeout(confeti,60);
    pantallaFinal('celebrant','Lliçó completada!',esc(L.titol),
      `<div class="tile t-xp"><b>Punts</b><span class="count" data-n="${xp}">+${xp}</span></div><div class="tile t-acc"><b>Encerts</b><span>${acc}%</span></div>`,bannerObjectiu(meta),next);
  }
  L=null;
}
function fiRepte(temps){
  clearInterval(L.timer);
  const n=L.encerts, xp=n*2, prev=P.reptes[L.sid];
  const rec=prev==null||n>prev;
  if(rec)P.reptes[L.sid]=n;
  afegeixXP(xp);if(n)sumaDia();const meta=sumaActivitat();desa();
  const bo=n>=REPTE_N*0.75;
  if(bo){fx('fi');setTimeout(confeti,60)}else fx('bad');
  pantallaFinal(bo?'celebrant':n>=REPTE_N/2?'contenta':'trista',temps?'Temps esgotat!':'Repte acabat!',
    (rec&&prev!=null?'Nou rècord! ':'')+(bo?'Ho domines!':'Repassa aquesta secció i torna-ho a provar.'),
    `<div class="tile t-acc"><b>Encerts</b><span>${n}/${REPTE_N}</span></div><div class="tile t-xp"><b>Punts</b><span class="count" data-n="${xp}">+${xp}</span></div>`,bannerObjectiu(meta));
  L=null;
}
function senseVides(){
  recuperaVides();
  const min=Math.max(1,Math.ceil((P.vidaTs+MIN_PER_VIDA*60000-Date.now())/60000));
  $('#app').innerHTML=`<div class="end gut"><img src="${IMG.trista}" alt="La Gota trista">
    <h2>T'has quedat sense vides</h2>
    <p style="margin:0;color:var(--muted);max-width:32ch">Recuperes una vida cada ${MIN_PER_VIDA} minuts. La propera arriba d'aquí a ${min} min. Mentrestant pots fer el repàs d'errors o un repte, que no gasten vides.</p>
    <div class="actions"><button class="big" id="cont">Torna a l'inici</button></div></div>`;
  L=null;$('#cont').onclick=inici;
}

async function arrenca(){
  await carrega();
  if(!WEB)return inici();
  SB=window.supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true}});
  const q=new URLSearchParams(location.search+'&'+location.hash.slice(1));
  const err=q.get('error_description')||q.get('error');
  const {data:{session}}=await SB.auth.getSession();
  if(location.hash||location.search)history.replaceState(null,'',location.pathname);
  if(!session)return pantallaEntra(err?"Aquest compte no està donat d'alta a la Gota. Entra amb el correu de l'institut o parla amb el professor.":null);
  const {data,error}=await SB.rpc('gota_jo');
  if(error){JO=null;return inici()}
  if(!data)return pantallaNoAlumne(session.user.email);
  if(data.profe){JO={profe:true,classes:data.classes||[],email:session.user.email};return inici()}
  JO={nom:data.nom,cognoms:data.cognoms,classe:data.classe,email:session.user.email};
  fusiona(data.dades);inici();
}
arrenca().catch(()=>{$('#app').innerHTML='<p class="gut" style="padding-block:40px">No s\'ha pogut carregar la Gota. Torna a obrir la pàgina.</p>'});
if('serviceWorker' in navigator&&WEB)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
